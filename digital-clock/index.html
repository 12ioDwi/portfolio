<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
        }

        /* Light Mode (Default) */
        body.light-mode {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        body.light-mode .clock {
            background: white;
            color: #333;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        body.light-mode .clock:hover {
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        body.light-mode .city {
            color: #333;
        }

        body.light-mode .timezone {
            color: #666;
        }

        body.light-mode .time {
            color: #667eea;
        }

        body.light-mode .date {
            color: #999;
        }

        body.light-mode h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        body.light-mode .subtitle {
            color: rgba(255, 255, 255, 0.8);
        }

        body.light-mode .theme-btn {
            background: white;
            border: 2px solid #667eea;
            color: #333;
        }

        body.light-mode .nav-btn {
            background: white;
            border: 2px solid #667eea;
            color: #333;
        }

        body.light-mode .nav-btn:hover {
            background: #667eea;
            color: white;
        }

        body.light-mode .search-box {
            background: white;
            border: 2px solid #667eea;
            color: #333;
        }

        body.light-mode .search-box::placeholder {
            color: #999;
        }

        body.light-mode .add-btn {
            background: #667eea;
            color: white;
            border: none;
        }

        body.light-mode .add-btn:hover {
            background: #764ba2;
        }

        body.light-mode .modal {
            background: white;
            color: #333;
        }

        body.light-mode .modal input {
            background: white;
            border: 2px solid #667eea;
            color: #333;
        }

        body.light-mode .modal input::placeholder {
            color: #999;
        }

        body.light-mode .remove-btn {
            background: #ff6b6b;
            color: white;
        }

        body.light-mode .stopwatch-display {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        /* Dark Mode */
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
        }

        body.dark-mode .clock {
            background: #0f3460;
            color: #e0e0e0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        body.dark-mode .clock:hover {
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
        }

        body.dark-mode .city {
            color: #e0e0e0;
        }

        body.dark-mode .timezone {
            color: #b0b0b0;
        }

        body.dark-mode .time {
            color: #00d4ff;
        }

        body.dark-mode .date {
            color: #808080;
        }

        body.dark-mode h1 {
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        body.dark-mode .subtitle {
            color: rgba(0, 212, 255, 0.7);
        }

        body.dark-mode .theme-btn {
            background: #0f3460;
            border: 2px solid #00d4ff;
            color: #00d4ff;
        }

        body.dark-mode .nav-btn {
            background: #0f3460;
            border: 2px solid #00d4ff;
            color: #00d4ff;
        }

        body.dark-mode .nav-btn:hover {
            background: #00d4ff;
            color: #1a1a2e;
        }

        body.dark-mode .search-box {
            background: #0f3460;
            border: 2px solid #00d4ff;
            color: #e0e0e0;
        }

        body.dark-mode .search-box::placeholder {
            color: #808080;
        }

        body.dark-mode .add-btn {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
        }

        body.dark-mode .add-btn:hover {
            background: #0099cc;
        }

        body.dark-mode .modal {
            background: #0f3460;
            color: #e0e0e0;
        }

        body.dark-mode .modal input {
            background: #16213e;
            border: 2px solid #00d4ff;
            color: #e0e0e0;
        }

        body.dark-mode .modal input::placeholder {
            color: #808080;
        }

        body.dark-mode .remove-btn {
            background: #ff6b6b;
            color: white;
        }

        body.dark-mode .stopwatch-display {
            background: #0f3460;
            color: #00d4ff;
            border: 2px solid #00d4ff;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Navigation */
        .nav-container {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .nav-btn.active {
            transform: scale(1.05);
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .theme-btn {
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .theme-btn:hover {
            transform: scale(1.1) rotate(20deg);
        }

        .theme-btn:active {
            transform: scale(0.95);
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            text-align: center;
            font-size: 3em;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .subtitle {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 40px;
            transition: all 0.3s ease;
        }

        /* Clock Section */
        #clockSection {
            display: none;
        }

        #clockSection.active {
            display: block;
        }

        .search-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-box {
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 1em;
            width: 250px;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            transform: scale(1.05);
        }

        .add-btn {
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            transform: scale(1.05);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .clock {
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .clock:hover {
            transform: translateY(-5px);
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            transform: scale(1.1);
        }

        .city {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .timezone {
            font-size: 0.9em;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .time {
            font-size: 2.5em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .date {
            font-size: 0.95em;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        /* Stopwatch Section */
        #stopwatchSection {
            display: none;
        }

        #stopwatchSection.active {
            display: block;
        }

        .stopwatch-container {
            background: transparent;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .stopwatch-display {
            font-size: 4em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            letter-spacing: 3px;
            transition: all 0.3s ease;
        }

        .stopwatch-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .sw-btn {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        .sw-btn.start {
            background: #4ade80;
            color: white;
        }

        .sw-btn.start:hover {
            background: #22c55e;
        }

        .sw-btn.stop {
            background: #ef4444;
            color: white;
        }

        .sw-btn.stop:hover {
            background: #dc2626;
        }

        .sw-btn.reset {
            background: #64748b;
            color: white;
        }

        .sw-btn.reset:hover {
            background: #475569;
        }

        .mode-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .mode-tab {
            padding: 10px 20px;
            border: 2px solid currentColor;
            border-radius: 10px;
            background: transparent;
            color: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-tab.active {
            transform: scale(1.05);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 15px;
            padding: 30px;
            z-index: 2000;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .modal.active {
            display: block;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1500;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 1em;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-buttons .confirm {
            background: #667eea;
            color: white;
        }

        .modal-buttons .confirm:hover {
            background: #764ba2;
        }

        .modal-buttons .cancel {
            background: #999;
            color: white;
        }

        .modal-buttons .cancel:hover {
            background: #777;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .nav-container {
                flex-wrap: wrap;
                gap: 8px;
            }

            .nav-btn {
                padding: 6px 12px;
                font-size: 0.8em;
            }

            h1 {
                font-size: 2em;
            }

            .clocks-grid {
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 15px;
                padding: 15px;
            }

            .time {
                font-size: 2em;
            }

            .city {
                font-size: 1.1em;
            }

            .stopwatch-display {
                font-size: 3em;
            }

            .search-box {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .nav-container {
                left: 10px;
                top: 10px;
            }

            h1 {
                font-size: 1.5em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .time {
                font-size: 1.8em;
            }

            .stopwatch-display {
                font-size: 2.5em;
            }

            .stopwatch-buttons {
                flex-direction: column;
            }

            .sw-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body class="light-mode">
    <div class="nav-container">
        <button class="nav-btn active" data-section="clock">🕐 Clock</button>
        <button class="nav-btn" data-section="stopwatch">⏱️ Stopwatch</button>
    </div>

    <div class="theme-toggle">
        <button class="theme-btn" id="themeToggle" title="Toggle Dark/Light Mode">
            <span class="theme-icon">🌙</span>
        </button>
    </div>

    <!-- Clock Section -->
    <div id="clockSection" class="active">
        <div class="container">
            <h1>World Clock</h1>
            <p class="subtitle">Current time in different time zones</p>
            
            <div class="search-filter">
                <input type="text" class="search-box" id="searchBox" placeholder="Search cities (e.g., Tokyo, New York)...">
                <button class="add-btn" id="addBtn">+ Add Custom</button>
            </div>
            
            <div class="clocks-grid" id="clocksGrid">
                <!-- Clocks will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Stopwatch Section -->
    <div id="stopwatchSection">
        <div class="container">
            <h1>Stopwatch & Timer</h1>
            
            <div class="stopwatch-container">
                <div class="mode-tabs">
                    <button class="mode-tab active" data-mode="stopwatch">Stopwatch</button>
                    <button class="mode-tab" data-mode="timer">Timer</button>
                </div>

                <div class="stopwatch-display" id="stopwatchDisplay">00:00:00</div>

                <div class="stopwatch-buttons" id="stopwatchButtons">
                    <button class="sw-btn start" id="startBtn">Start</button>
                    <button class="sw-btn stop" id="stopBtn" disabled>Stop</button>
                    <button class="sw-btn reset" id="resetBtn">Reset</button>
                </div>

                <div id="timerInput" style="display: none; margin-top: 20px;">
                    <input type="number" id="timerMinutes" placeholder="Minutes" min="0" max="59" style="padding: 10px; margin-right: 10px; border-radius: 8px;">
                    <input type="number" id="timerSeconds" placeholder="Seconds" min="0" max="59" style="padding: 10px; border-radius: 8px;">
                </div>
            </div>
        </div>
    </div>

    <!-- Add Custom Timezone Modal -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="addModal">
        <h2>Add Custom Timezone</h2>
        <input type="text" id="cityInput" placeholder="City name (e.g., Bangkok)">
        <input type="text" id="timezoneInput" placeholder="Timezone (e.g., Asia/Bangkok)">
        <div class="modal-buttons">
            <button class="confirm" onclick="addCustomTimezone()">Add</button>
            <button class="cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        // Define default time zones
        let timeZones = [
            { city: 'New York', timezone: 'America/New_York', custom: false },
            { city: 'London', timezone: 'Europe/London', custom: false },
            { city: 'Paris', timezone: 'Europe/Paris', custom: false },
            { city: 'Tokyo', timezone: 'Asia/Tokyo', custom: false },
            { city: 'Sydney', timezone: 'Australia/Sydney', custom: false },
            { city: 'Dubai', timezone: 'Asia/Dubai', custom: false },
            { city: 'Singapore', timezone: 'Asia/Singapore', custom: false },
            { city: 'Hong Kong', timezone: 'Asia/Hong_Kong', custom: false },
            { city: 'Los Angeles', timezone: 'America/Los_Angeles', custom: false },
            { city: 'Mexico City', timezone: 'America/Mexico_City', custom: false },
            { city: 'São Paulo', timezone: 'America/Sao_Paulo', custom: false },
            { city: 'Mumbai', timezone: 'Asia/Kolkata', custom: false }
        ];

        let stopwatchInterval = null;
        let stopwatchTime = 0;
        let timerInterval = null;
        let timerTime = 0;
        let isStopwatchRunning = false;
        let isTimerRunning = false;
        let currentMode = 'stopwatch';

        // Load custom timezones from localStorage
        function loadCustomTimezones() {
            const saved = localStorage.getItem('customTimezones');
            if (saved) {
                const customZones = JSON.parse(saved);
                timeZones = timeZones.concat(customZones);
            }
        }

        // Save custom timezones to localStorage
        function saveCustomTimezones() {
            const customZones = timeZones.filter(z => z.custom);
            localStorage.setItem('customTimezones', JSON.stringify(customZones));
        }

        // Initialize theme toggle
        function initializeTheme() {
            const themeToggle = document.getElementById('themeToggle');
            const savedTheme = localStorage.getItem('theme') || 'light-mode';
            
            document.body.className = savedTheme;
            updateThemeIcon(savedTheme);
            
            themeToggle.addEventListener('click', () => {
                const isDarkMode = document.body.classList.contains('dark-mode');
                
                if (isDarkMode) {
                    document.body.className = 'light-mode';
                    localStorage.setItem('theme', 'light-mode');
                    updateThemeIcon('light-mode');
                } else {
                    document.body.className = 'dark-mode';
                    localStorage.setItem('theme', 'dark-mode');
                    updateThemeIcon('dark-mode');
                }
            });
        }

        function updateThemeIcon(theme) {
            const themeIcon = document.querySelector('.theme-icon');
            themeIcon.textContent = theme === 'dark-mode' ? '☀️' : '🌙';
        }

        // Section Navigation
        function initializeNavigation() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const section = btn.dataset.section;
                    switchSection(section);
                });
            });
        }

        function switchSection(section) {
            document.querySelectorAll('#clockSection, #stopwatchSection').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            if (section === 'clock') {
                document.getElementById('clockSection').classList.add('active');
            } else {
                document.getElementById('stopwatchSection').classList.add('active');
            }
            
            document.querySelector(`[data-section="${section}"]`).classList.add('active');
        }

        // Initialize clocks
        function initializeClocks() {
            renderClocks();
            updateAllClocks();
        }

        function renderClocks(filter = '') {
            const clocksGrid = document.getElementById('clocksGrid');
            clocksGrid.innerHTML = '';

            const filtered = timeZones.filter(tz => 
                tz.city.toLowerCase().includes(filter.toLowerCase()) || 
                tz.timezone.toLowerCase().includes(filter.toLowerCase())
            );

            filtered.forEach(({ city, timezone, custom }) => {
                const clockDiv = document.createElement('div');
                clockDiv.className = 'clock';
                clockDiv.innerHTML = `
                    ${custom ? `<button class="remove-btn" onclick="removeTimezone('${timezone}')">×</button>` : ''}
                    <div class="city">${city}</div>
                    <div class="timezone">${timezone}</div>
                    <div class="time" data-timezone="${timezone}">--:--:--</div>
                    <div class="date" data-timezone-date="${timezone}">---</div>
                `;
                clocksGrid.appendChild(clockDiv);
            });
        }

        function updateAllClocks() {
            timeZones.forEach(({ timezone }) => {
                const timeElement = document.querySelector(`.time[data-timezone="${timezone}"]`);
                const dateElement = document.querySelector(`.date[data-timezone-date="${timezone}"]`);

                if (timeElement && dateElement) {
                    const now = new Date();

                    const timeString = new Intl.DateTimeFormat('en-US', {
                        timeZone: timezone,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    }).format(now);

                    const dateString = new Intl.DateTimeFormat('en-US', {
                        timeZone: timezone,
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    }).format(now);

                    timeElement.textContent = timeString;
                    dateElement.textContent = dateString;
                }
            });
        }

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            renderClocks(e.target.value);
        });

        // Add custom timezone
        document.getElementById('addBtn').addEventListener('click', openModal);

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('addModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('addModal').classList.remove('active');
        }

        function addCustomTimezone() {
            const city = document.getElementById('cityInput').value.trim();
            const timezone = document.getElementById('timezoneInput').value.trim();

            if (!city || !timezone) {
                alert('Please fill in all fields');
                return;
            }

            timeZones.push({ city, timezone, custom: true });
            saveCustomTimezones();
            renderClocks();
            closeModal();
            document.getElementById('cityInput').value = '';
            document.getElementById('timezoneInput').value = '';
        }

        function removeTimezone(timezone) {
            timeZones = timeZones.filter(tz => tz.timezone !== timezone);
            saveCustomTimezones();
            renderClocks();
        }

        document.getElementById('modalOverlay').addEventListener('click', closeModal);

        // Stopwatch/Timer functionality
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentMode = tab.dataset.mode;
                document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                if (currentMode === 'stopwatch') {
                    document.getElementById('timerInput').style.display = 'none';
                    resetStopwatch();
                } else {
                    document.getElementById('timerInput').style.display = 'flex';
                    resetTimer();
                }
            });
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (currentMode === 'stopwatch') {
                startStopwatch();
            } else {
                startTimer();
            }
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            if (currentMode === 'stopwatch') {
                stopStopwatch();
            } else {
                stopTimer();
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (currentMode === 'stopwatch') {
                resetStopwatch();
            } else {
                resetTimer();
            }
        });

        function startStopwatch() {
            if (isStopwatchRunning) return;
            isStopwatchRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            const startTime = Date.now() - stopwatchTime;
            stopwatchInterval = setInterval(() => {
                stopwatchTime = Date.now() - startTime;
                document.getElementById('stopwatchDisplay').textContent = formatTime(stopwatchTime);
            }, 10);
        }

        function stopStopwatch() {
            isStopwatchRunning = false;
            clearInterval(stopwatchInterval);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }

        function resetStopwatch() {
            stopStopwatch();
            stopwatchTime = 0;
            document.getElementById('stopwatchDisplay').textContent = '00:00:00';
        }

        function startTimer() {
            if (isTimerRunning) return;
            const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;
            const seconds = parseInt(document.getElementById('timerSeconds').value) || 0;
            timerTime = (minutes * 60 + seconds) * 1000;

            if (timerTime <= 0) {
                alert('Please enter a valid time');
                return;
            }

            isTimerRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            const startTime = Date.now();

            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = timerTime - elapsed;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('stopwatchDisplay').textContent = '00:00:00';
                    isTimerRunning = false;
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                    alert('Timer finished!');
                    return;
                }

                document.getElementById('stopwatchDisplay').textContent = formatTime(remaining);
            }, 10);
        }

        function stopTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }

        function resetTimer() {
            stopTimer();
            document.getElementById('stopwatchDisplay').textContent = '00:00:00';
            document.getElementById('timerMinutes').value = '';
            document.getElementById('timerSeconds').value = '';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initializeTheme();
            initializeNavigation();
            loadCustomTimezones();
            initializeClocks();
            setInterval(updateAllClocks, 1000);
        });
    </script>
</body>
</html>
