<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock Portfolio</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        p {
            color: #b0bec5;
            margin-bottom: 30px;
        }
        .clock-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px 60px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }
        #time {
            font-size: 4rem;
            font-weight: bold;
            font-family: monospace;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            margin-bottom: 10px;
        }
        #date {
            font-size: 1.2rem;
            color: #e0e0e0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>World Clock</h1>
    <p>Current time in your local time zone</p>

    <div class="clock-container">
        <div id="time">00:00:00</div>
        <div id="date">Memuat tanggal...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Format Jam
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
            
            // Format Tanggal
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('id-ID', options);
        }

        // Jalankan setiap 1 detik
        setInterval(updateClock, 1000);
        updateClock(); // Jalankan langsung di awal
    </script>
</body>
</html>
